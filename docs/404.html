<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Not found — Kilo App</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<style>
  :root { --accent: #4f46e5; --text: #0f172a; --muted: #475569; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #f8fafc; color: var(--text);
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    text-align: center; padding: 24px;
  }
  img { width: 76px; height: 76px; margin-bottom: 22px; }
  h1 { font-size: 2rem; margin: 0 0 10px; letter-spacing: -0.03em; }
  p { color: var(--muted); margin: 0 0 26px; }
  a {
    display: inline-block; padding: 11px 20px; border-radius: 6px;
    background: linear-gradient(135deg, #818cf8, #4f46e5); color: #fff;
    font-weight: 600; font-size: 14.5px; text-decoration: none;
  }
  a:hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <main>
    <img src="logo.svg" alt="" />
    <h1>Page not found</h1>
    <p>That page does not exist on this site.</p>
    <a href="/Kilo-App/">Back to Kilo App</a>
  </main>
</body>
</html>
